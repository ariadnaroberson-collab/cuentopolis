<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Herencia Hispana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1b1712; --panel:#241f18; --panel2:#2d271e; --line:#3d3528;
  --parch:#f4ecd8; --dim:#cfc3a6; --gold:#c9a24b; --gold2:#e3c878; --green:#5f9a6e; --sky:#8fb8d8;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse at top,#2a241b 0%,var(--bg) 70%) fixed;background-color:var(--bg);color:var(--parch);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}

header.top{text-align:center;display:grid;gap:10px;padding-block:14px 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:700}
h1{font-size:clamp(32px,5.4vw,54px);font-weight:800}
.sub{color:var(--dim);max-width:52ch;margin:0 auto}
.bands{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.band{border:1.5px solid var(--gold);background:transparent;color:var(--gold2);border-radius:999px;padding:10px 20px;font-weight:700}
.band[aria-pressed="true"]{background:var(--gold);color:#1b1712}

nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--dim)}
nav.tabs button[aria-selected="true"]{color:var(--gold2);border-bottom-color:var(--gold)}

section.view{display:grid;gap:18px}
h2{font-size:clamp(24px,3.2vw,34px);font-weight:800}
.lead{color:var(--dim);max-width:62ch}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative}
.stop{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;gap:8px;align-content:start}
.stop:hover{border-color:var(--gold)}
.stop .when{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold2)}
.stop h3{font-size:20px}
.stop p{color:var(--dim);font-size:15px}
.stop .go{font-size:14px;font-weight:700;color:var(--gold2)}
.stop.fiesta{border:2px solid var(--gold);background:var(--panel2)}

/* mission */
.mission{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
.mission h3{font-size:24px;color:var(--gold2)}
.mhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--green);border:1px solid var(--green);border-radius:999px;padding:3px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pick{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.pick:hover{border-color:var(--gold)}
.pcard{display:grid;gap:6px;align-content:start}
.more{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--dim);padding-left:4px}
.chip{border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;text-decoration:none}
.chip:hover{background:rgba(201,162,75,.15)}
.pick svg{width:48px;height:32px;flex:none;border-radius:3px;outline:1px solid rgba(255,255,255,.2)}
.pick b{display:block;font-size:16px}
.pick span{display:block;font-size:13px;color:var(--dim)}
.pick .arrow{margin-left:auto;color:var(--gold2);font-weight:700}
.steps{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--dim)}
.steps b{color:var(--parch)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--gold);color:#1b1712;padding:10px 18px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--gold);color:var(--gold2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* explorer */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--parch);font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--dim)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile svg{width:100%;max-width:120px;height:auto;border-radius:4px;outline:1px solid rgba(255,255,255,.2)}
.tile b{font-family:var(--display);font-size:18px}
.tile span{font-size:12px;color:var(--dim)}

/* country panel */
.overlay{position:fixed;inset:0;background:rgba(8,6,4,.78);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.card{background:var(--panel);border:1px solid var(--gold);border-radius:18px;max-width:760px;width:100%;margin-block:20px;padding:22px;display:grid;gap:16px}
.chead{display:flex;gap:16px;align-items:center}
.chead svg{width:110px;height:auto;flex:none;border-radius:5px;outline:1px solid rgba(255,255,255,.25)}
.chead h2{font-size:clamp(28px,4vw,40px)}
.close{margin-left:auto;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--dim)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fact{background:var(--panel2);border-radius:10px;padding:10px 12px}
.fact small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.ficha{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.7;background:var(--panel2);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px}
.ficha p+p{margin-top:.5em}
.sect{display:grid;gap:8px}
.sect h3{font-size:18px;color:var(--gold2)}
.links{display:grid;gap:8px}
.link{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none}
.link:hover{border-color:var(--gold)}
.link b{display:block}
.link span{font-size:13px;color:var(--dim)}
.link .arrow{margin-left:auto;color:var(--gold2);font-weight:700;flex:none}
.none{color:var(--dim);font-size:15px}
.check{display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:8px;padding:8px 10px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--gold);width:18px;height:18px;flex:none}
.note{font-size:13px;color:var(--dim)}

/* ruleta */
.rgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.wheelbox{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1}
.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--gold2);z-index:2}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-weight:800;color:var(--gold2);font-size:clamp(13px,1.6vw,18px);line-height:1.05}
.rctrl{display:grid;gap:12px}
.rctrl input{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--parch)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.alist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.alist li{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.alist li svg{width:40px;height:27px;flex:none;border-radius:2px}
.alist li span{display:block;color:var(--dim);font-size:12px}
.linkbtn{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:14px;padding:0}
.win{background:var(--parch);color:#1b1712;border-radius:18px;padding:24px;max-width:560px;width:100%;margin:40px auto;display:grid;gap:12px;justify-items:center;text-align:center}
.win svg{width:min(280px,70%);height:auto;border-radius:6px}
.win h2{color:#1b1712;font-size:clamp(32px,5vw,48px)}
@media (max-width:760px){.rgrid{grid-template-columns:1fr}}
footer{margin-top:40px;text-align:center;font-size:13px;color:var(--dim)}

@media (max-width:760px){.road{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.road{grid-template-columns:1fr}.chead{flex-wrap:wrap}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Cuentópolis · 15 de septiembre – 15 de octubre</div>
    <h1>Mi Mes de la Herencia Hispana</h1>
    <p class="sub">Elige tu clase. Aquí están tu ruta, tus misiones y tus lecturas de Cuentópolis.</p>
    <div class="bands" role="group" aria-label="Mi clase" id="bands"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
  <footer>¡Nos vemos en la gran fiesta del 10 de octubre! · Cuentópolis</footer>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
function star(cx,cy,R,fill){let r=R*.4,p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${fill}"/>`}
function hs(cols,w){w=w||cols.map(()=>1);const t=w.reduce((a,b)=>a+b,0);let y=0;return cols.map((c,i)=>{const h=200*w[i]/t;const s=`<rect x="0" y="${y.toFixed(2)}" width="300" height="${(h+.5).toFixed(2)}" fill="${c}"/>`;y+=h;return s}).join('')}
function vs(cols){return cols.map((c,i)=>`<rect x="${i*100}" y="0" width="${i===cols.length-1?100:101}" height="200" fill="${c}"/>`).join('')}
function emblem(fill,stroke){return `<circle cx="150" cy="100" r="20" fill="${fill}" stroke="${stroke||'#3d7a2e'}" stroke-width="4"/>`}
function sun(cx,cy,r,c){let s='';for(let i=0;i<16;i++){const a=i*Math.PI/8;s+=`<line x1="${cx+r*Math.cos(a)}" y1="${cy+r*Math.sin(a)}" x2="${cx+r*1.75*Math.cos(a)}" y2="${cy+r*1.75*Math.sin(a)}" stroke="${c}" stroke-width="3"/>`}return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`}
const W='#FFFFFF';
const FLAGS={
 CR:()=>hs(['#002B7F',W,'#CE1126',W,'#002B7F'],[1,1,2,1,1]),
 CU:()=>hs(['#002A8F',W,'#002A8F',W,'#002A8F'])+`<polygon points="0,0 0,200 173,100" fill="#CF142B"/>`+star(58,100,26,W),
 MX:()=>vs(['#006847',W,'#CE1126'])+emblem('#B5793B'),
 ES:()=>hs(['#AA151B','#F1BF00','#AA151B'],[1,2,1])+`<rect x="70" y="78" width="28" height="44" rx="6" fill="#AA151B" stroke="#8a6d00" stroke-width="3"/>`,
 CL:()=>`<rect width="300" height="100" fill="${W}"/><rect y="100" width="300" height="100" fill="#D52B1E"/><rect width="100" height="100" fill="#0039A6"/>`+star(50,50,24,W),
 VE:()=>{let s=hs(['#FFCC00','#00247D','#CF142B']);for(let i=0;i<8;i++){const a=(-160+i*20)*Math.PI/180;s+=star(150+52*Math.cos(a),128+52*Math.sin(a),7,W)}return s},
 UY:()=>{let s='';for(let i=0;i<9;i++)s+=`<rect y="${i*200/9}" width="300" height="${200/9+.5}" fill="${i%2?'#0038A8':W}"/>`;return s+`<rect width="112" height="${5*200/9}" fill="${W}"/>`+sun(56,55,17,'#FCD116')},
 PA:()=>`<rect width="300" height="200" fill="${W}"/><rect x="150" width="150" height="100" fill="#D21034"/><rect y="100" width="150" height="100" fill="#005293"/>`+star(75,50,20,'#005293')+star(225,150,20,'#D21034'),
 DO:()=>`<rect width="300" height="200" fill="${W}"/><rect width="133" height="85" fill="#002D62"/><rect x="167" width="133" height="85" fill="#CE1126"/><rect y="115" width="133" height="85" fill="#CE1126"/><rect x="167" y="115" width="133" height="85" fill="#002D62"/><circle cx="150" cy="100" r="11" fill="#3d7a2e"/>`,
 PY:()=>hs(['#D52B1E',W,'#0038A8'])+`<circle cx="150" cy="100" r="18" fill="none" stroke="#3d7a2e" stroke-width="3"/>`+star(150,100,7,'#F2C100'),
 SV:()=>hs(['#0F47AF',W,'#0F47AF'])+`<circle cx="150" cy="100" r="19" fill="none" stroke="#3d7a2e" stroke-width="4"/><polygon points="150,87 162,108 138,108" fill="#0F47AF"/>`,
 AR:()=>hs(['#74ACDF',W,'#74ACDF'])+sun(150,100,12,'#F6B40E'),
 BO:()=>hs(['#D52B1E','#F9E300','#007934']),
 CO:()=>hs(['#FCD116','#003893','#CE1126'],[2,1,1]),
 EC:()=>hs(['#FFD100','#034EA2','#ED1C24'],[2,1,1])+`<ellipse cx="150" cy="100" rx="17" ry="22" fill="#6FB7F2" stroke="#7a5a1a" stroke-width="3"/>`,
 GT:()=>vs(['#4997D0',W,'#4997D0'])+`<circle cx="150" cy="100" r="20" fill="none" stroke="#3d7a2e" stroke-width="5"/>`,
 GQ:()=>hs(['#3E9A00',W,'#E32118'])+`<polygon points="0,0 0,200 75,100" fill="#0073CE"/><rect x="138" y="86" width="24" height="28" rx="3" fill="none" stroke="#777" stroke-width="3"/>`,
 HN:()=>hs(['#0073CF',W,'#0073CF'])+[[150,100],[118,84],[182,84],[118,116],[182,116]].map(p=>star(p[0],p[1],9,'#0073CF')).join(''),
 NI:()=>hs(['#0067C6',W,'#0067C6'])+`<polygon points="150,84 167,113 133,113" fill="none" stroke="#C8A000" stroke-width="4"/>`,
 PE:()=>vs(['#D91023',W,'#D91023']),
 PR:()=>hs(['#ED0000',W,'#ED0000',W,'#ED0000'])+`<polygon points="0,0 0,200 173,100" fill="#0050F0"/>`+star(58,100,26,W)
};
function flagSVG(code){return `<svg viewBox="0 0 300 200" role="img" aria-label="Bandera"><rect width="300" height="200" fill="#fff"/>${FLAGS[code]()}</svg>`}

const BASE='https://ariadnaroberson-collab.github.io/cuentopolis/';
const VIKI='https://es.vikidia.org/wiki/';
const AUTORES=[
 {n:'Miguel de Cervantes',kd:'Miguel_de_Cervantes',code:'ES',anio:'1547–1616',vk:'Miguel_de_Cervantes_Saavedra',obras:[['Don Quijote','quijote_reader.html']],
  datos:['Nació en Alcalá de Henares, España.','En una batalla perdió el uso de la mano izquierda.','Estuvo 5 años prisionero en Argel.','Su Don Quijote pelea contra molinos: ¡cree que son gigantes!']},
 {n:'Pedro Antonio de Alarcón',code:'ES',anio:'1833–1891',vk:'',obras:[['El sombrero de tres picos','sombrero_reader.html']],
  datos:['Nació en Guadix, en el sur de España.','Fue periodista y viajó mucho.','Escribió El sombrero de tres picos en 1874.','Su historia se convirtió en un ballet con música de Manuel de Falla.']},
 {n:'Ricardo Palma',kd:'Ricardo_Palma',code:'PE',anio:'1833–1919',vk:'',obras:[['La camisa de Margarita','camisa_margarita_reader.html']],
  datos:['Nació en Lima, Perú.','Escribió las Tradiciones peruanas: historias cortas y divertidas sobre la Lima de antes.','Fue director de la Biblioteca Nacional del Perú.','Después de una guerra, la biblioteca quedó casi vacía. Palma pidió libros a todo el mundo y la llenó otra vez: le decían "el bibliotecario mendigo".']},
 {n:'Autor anónimo',kd:'La_vida_de_Lazarillo_de_Tormes',code:'ES',anio:'1554',vk:'',obras:[['Lazarillo de Tormes','lazarillo_reader.html']],
  datos:['El libro se publicó en España en 1554.','Nadie sabe quién lo escribió: ¡es un misterio!','Es la primera novela picaresca: la historia de un pícaro, un niño pobre y muy listo.','Estuvo prohibido en España durante muchos años.']},
 {n:'Horacio Quiroga',kd:'Horacio_Quiroga',code:'UY',anio:'1878–1937',vk:'',obras:[['Las medias de los flamencos','medias_flamencos_reader.html'],['Versión original','cuentos_de_la_selva_reader.html?story=medias-flamencos']],
  datos:['Nació en Salto, Uruguay.','Vivió muchos años en la selva de Misiones, en Argentina.','Escribió Cuentos de la selva (1918) para sus hijos.','Le gustaban la fotografía, las motos y construir cosas.']},
 {n:'José Martí',kd:'Jos%C3%A9_Mart%C3%AD',code:'CU',anio:'1853–1895',vk:'',obras:[['Los Zapaticos de Rosa','los-zapaticos-de-rosa.html'],['El Baúl de Emilio','baul_de_emilio_episodio4_reader_Jose_Marti.html']],
  datos:['Nació en La Habana, Cuba.','A los 16 años ya publicaba un periódico.','Creó La Edad de Oro, una revista para niños.','Sus Versos sencillos inspiraron la canción "Guantanamera".']}
];

const C={
 MX:{n:'México',cap:'Ciudad de México',reg:'Norteamérica',idi:'español',vk:'M%C3%A9xico',
   ficha:['México está en Norteamérica. La capital es la Ciudad de México.','Una comida famosa es el taco. Otra comida famosa es el mole.','El águila real está en la bandera de México. ¡También vive allí el ajolote, un animal muy curioso!','En noviembre, las familias celebran el Día de Muertos con flores, velas y comida.','¿Sabías que el chocolate viene de esta región? Los pueblos antiguos ya tomaban cacao.']},
 GT:{n:'Guatemala',cap:'Ciudad de Guatemala',reg:'Centroamérica',idi:'español y lenguas mayas',vk:'Guatemala',
   ficha:['Guatemala está en Centroamérica, al lado de Belice. La capital es la Ciudad de Guatemala.','Una comida típica es el pepián, un guiso con semillas y chiles.','El ave nacional es el quetzal. ¡El dinero de Guatemala también se llama quetzal!','Muchas personas son mayas. Hablan español y también lenguas mayas.','Las mujeres mayas tejen huipiles de muchos colores.']},
 HN:{n:'Honduras',cap:'Tegucigalpa',reg:'Centroamérica',idi:'español',vk:'Honduras',
   ficha:['Honduras está en Centroamérica. La capital es Tegucigalpa.','Una comida muy popular es la baleada: una tortilla de harina con frijoles y queso.','El ave nacional es la guacamaya roja.','En la costa viven los garífunas, como en Belice. Tienen su propia música: la punta.','En Copán hay ruinas mayas muy antiguas.']},
 SV:{n:'El Salvador',cap:'San Salvador',reg:'Centroamérica',idi:'español',vk:'El_Salvador',
   ficha:['El Salvador está en Centroamérica. La capital es San Salvador.','Es el país más pequeño de Centroamérica, ¡pero tiene muchos volcanes!','La comida más famosa es la pupusa: una tortilla gruesa con queso, frijoles o chicharrón.','El ave nacional es el torogoz. Tiene una cola larga y muy bonita.','El Cipitío es un personaje famoso de sus leyendas.']},
 NI:{n:'Nicaragua',cap:'Managua',reg:'Centroamérica',idi:'español',vk:'Nicaragua',
   ficha:['Nicaragua está en Centroamérica. La capital es Managua.','Tiene el lago más grande de Centroamérica: el lago de Nicaragua.','Una comida típica es el gallo pinto: arroz con frijoles.','El ave nacional es el guardabarranco.','En Diriamba bailan El Güegüense, una obra con máscaras de madera.']},

   <div class="grid">${LEYENDAS.map(l=>pick(BASE+l[2],l[1],l[0],'Leyenda de '+C[l[1]].n)).join('')}</div>
   <ol class="steps"><li><b>Lean</b> la leyenda juntos.</li><li><b>Cuenten</b> la historia con sus palabras: ¿quién?, ¿dónde?, ¿qué pasa?</li><li><b>Preparen</b> la leyenda para contarla en la fiesta.</li></ol></article>`,
 pasaporte:()=>`<article class="mission"><div class="mhead"><h3>Mi Pasaporte del País</h3><span class="tag">Individual</span></div>
   <p class="lead">Busca tu país en el <b>Explorador de países</b>. Allí encuentras su ficha, las historias de Cuentópolis y más lecturas.</p>
   <div class="row"><button class="btn" data-go="paises">Ir al Explorador de países →</button></div></article>`,
 chile:()=>`<article class="mission"><div class="mhead"><h3>Proyecto de la clase: arpilleras de Chile</h3><span class="tag">Toda la clase</span></div>
   <p class="lead">Vamos a hacer arpilleras: cuadros de tela cosidos, un arte tradicional de Chile. Primero leemos cómo Florencia hace la suya con su abuela.</p>
   <div class="grid">${pick(READS.CL[1].u,'CL','Los Retazos de Florencia','Biblioteca FVR · arpilleras')}${pick(READS.CL[0].u,'CL','La Collera de Javiera','Entrevistas callejeras · rodeo y cueca')}<a class="pick" href="${VIKI+'Chile'}" target="_blank" rel="noopener">${flag('CL')}<div><b>Chile en Vikidia</b><span>Enciclopedia para jóvenes</span></div><span class="arrow" aria-hidden="true">→</span></a></div>
   <div class="row"><button class="btn" data-country="CL">Ficha de Chile</button></div></article>`,
 memorias:()=>`<article class="mission"><div class="mhead"><h3>Mi país en Memorias de pueblos perdidos</h3><span class="tag">Individual</span></div>
   <p class="lead">Busca el país que te tocó en el sorteo y abre su historia. Cada historia cuenta cómo un niño o una niña llega a la escuela.</p>
   <div class="grid">${MEMORIAS.map(m=>pick(BASE+m[2],m[0],m[1],cname(m[0]))).join('')}</div>
   <ol class="steps"><li><b>Lee</b> tu historia en el nivel que te asignó tu maestra.</li><li><b>Investiga</b> tu país en el Explorador: geografía, cultura y comida.</li><li><b>Prepara</b> tu presentación: ¿qué reto tiene el protagonista?</li></ol></article>`,
 autor:()=>`<article class="mission"><div class="mhead"><h3>Persona de la literatura</h3><span class="tag">Individual</span></div>
   <p class="lead">Cada estudiante es un autor. Lee su obra, busca su escena favorita y 3 datos curiosos. Después haz su <b>perfil de LetraGram</b> y su <b>monólogo de 60 segundos</b> para la fiesta.</p>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${AUTORES.map(a=>`<div class="pick" style="display:grid;gap:8px;align-items:start">
     <div style="display:flex;gap:10px;align-items:center">${flag(a.code)}<div><b>${a.n}</b><span>${C[a.code].n} · ${a.anio}</span></div></div>
     <ul class="steps" style="padding-left:1.1em;font-size:14px">${a.datos.map(d=>`<li>${d}</li>`).join('')}</ul>
     <div class="row">${a.obras.map(o=>`<a class="btn" style="padding:6px 12px;font-size:14px" href="${BASE+o[1]}">${o[0]}</a>`).join('')}
     ${a.kd?`<a class="btn ghost" style="padding:6px 12px;font-size:14px" href="https://ninos.kiddle.co/${a.kd}" target="_blank" rel="noopener">Kiddle ↗</a>`:''}
     ${a.vk?`<a class="btn ghost" style="padding:6px 12px;font-size:14px" href="${VIKI+a.vk}" target="_blank" rel="noopener">Vikidia ↗</a>`:''}</div></div>`).join('')}</div>
   <ol class="steps"><li><b>Lee</b> la obra de tu autor y escoge tu escena favorita.</li><li><b>Completa</b> el perfil de LetraGram (3 publicaciones).</li><li><b>Prepara</b> tu monólogo de 60 segundos con un objeto.</li></ol></article>`,
 pr:()=>`<article class="mission"><div class="mhead"><h3>Máscaras de Puerto Rico</h3><span class="tag">Toda la clase</span></div>
   <p class="lead">Antes de hacer nuestras máscaras de vejigante, leemos cómo las hace Valeria en Ponce.</p>
   <div class="grid">${pick(READS.PR[0].u,'PR','El Vejigante de Valeria','Entrevistas callejeras · máscaras de Ponce')}${pick(READS.NI[0].u,'NI','La Máscara de Álvaro','Entrevistas callejeras · otra tradición de máscaras')}</div>
   <div class="row"><button class="btn" data-country="PR">Ficha de Puerto Rico</button></div></article>`
};
function vMisiones(B){return `<section class="view"><div><div class="eyebrow">${B.tab} · ${B.name}</div><h2>Mis misiones</h2></div>${B.missions.map(m=>M[m]()).join('')}</section>`}
/* ---------- RULETA (16 países: 3-5 y Middle School) ---------- */
const RPOOL=['CR','CU','ES','CL','VE','UY','PA','DO','PY','SV','AR','BO','GQ','HN','NI','PR'];
let rdraw=store.get('hhm-ruleta16',[]), rangle=0, rspin=false, rconfirm=false;
const SECP=['GT','EC','CO','MX','PE']; let secNames=store.get('hhm-sec5',{});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.sec;if(!k)return;secNames[k]=e.target.value;store.set('hhm-sec5',secNames)});
const rleft=()=>RPOOL.filter(k=>!rdraw.some(d=>d.k===k));
function vRuleta(){
  const left=rleft();
  return `<section class="view"><div><div class="eyebrow">3-5 y Middle School · 16 países</div><h2>Ruleta de países</h2></div>
  <p class="lead">Cada estudiante gira una vez. El país que te toca es el país de tu póster de investigación. Los países que ya salieron desaparecen de la ruleta.</p>
  <div class="rgrid"><div class="wheelbox"><div class="pointer" aria-hidden="true"></div><canvas id="rwheel" width="520" height="520" aria-label="Ruleta de países"></canvas><div class="hub" id="rhub"></div></div>
  <div class="rctrl"><label class="note" for="rname">Tu nombre</label><input id="rname" autocomplete="off" placeholder="Escribe tu nombre">
   <div class="row"><button class="btn" id="rspin" ${left.length?'':'disabled'}>¡Girar!</button></div>
   <div class="row" style="justify-content:space-between"><span class="note">Asignados: ${rdraw.length} · Quedan: ${left.length}</span>
    <span class="row">${rconfirm?`<span class="note">¿Borrar todo?</span><button class="linkbtn" id="ryes">Sí, borrar</button><button class="linkbtn" id="rno">No</button>`:`<button class="linkbtn" id="rundo" ${rdraw.length?'':'disabled'}>Deshacer el último</button><button class="linkbtn" id="rreset" ${rdraw.length?'':'disabled'}>Reiniciar</button>`}</span></div>
   <ul class="alist">${rdraw.map(d=>`<li>${flag(d.k)}<div><b>${C[d.k].n}</b><span>${d.w||'—'}</span></div></li>`).join('')}</ul>
  </div></div>
  <div class="mission"><div class="mhead"><h3>Secundaria · países ya asignados</h3><span class="tag">Escribe los nombres</span></div>
   <p class="lead">Estos 5 países no están en la ruleta. Escribe el nombre de cada estudiante; se guarda en esta computadora.</p>
   <ul class="alist">${SECP.map(k=>`<li>${flag(k)}<div style="flex:1;min-width:0"><b>${C[k].n}</b><input id="sec-${k}" data-sec="${k}" value="${(secNames[k]||'').replace(/"/g,'&quot;')}" placeholder="Nombre" autocomplete="off" style="width:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--parch);font-size:14px"></div></li>`).join('')}</ul></div>
  </section>`;
}
const RCOL=['#c9a24b','#5f9a6e','#8fb8d8','#d98b5f','#b58fd1','#e3c878'];
function drawWheel(){
  const cv=$('#rwheel'); if(!cv)return; const x=cv.getContext('2d'), dpr=window.devicePixelRatio||1, S=520;
  cv.width=S*dpr; cv.height=S*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const p=rleft(), n=p.length, R=S/2-6, c=S/2; x.clearRect(0,0,S,S);
  x.beginPath(); x.arc(c,c,R+4,0,Math.PI*2); x.fillStyle='#c9a24b'; x.fill();
  const hub=$('#rhub');
  if(!n){x.beginPath();x.arc(c,c,R,0,Math.PI*2);x.fillStyle='#2d271e';x.fill();if(hub)hub.textContent='¡Listo!';return}
  const a=Math.PI*2/n;
  for(let i=0;i<n;i++){const s0=rangle+i*a-Math.PI/2;x.beginPath();x.moveTo(c,c);x.arc(c,c,R,s0,s0+a);x.closePath();
    x.fillStyle=RCOL[(n%RCOL.length===1&&i===n-1)?2:i%RCOL.length];x.fill();x.strokeStyle='#1b1712';x.lineWidth=2;x.stroke();
    x.save();x.translate(c,c);x.rotate(s0+a/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle='#1b1712';
    let lab=C[p[i]].n; if(lab==='República Dominicana')lab='Rep. Dominicana';
    let f=n>12?16:n>6?19:22; const room=R-14-S*0.13; do{x.font=`700 ${f}px "Public Sans","Segoe UI",sans-serif`;f--}while(x.measureText(lab).width>room&&f>10);
    x.fillText(lab,R-14,0);x.restore();}
  if(hub)hub.innerHTML=`${n}<br>${n===1?'queda':'quedan'}`;
}
function rgo(){
  if(rspin)return; const p=rleft(), n=p.length; if(!n)return; rspin=true; $('#rspin').disabled=true;
  const who=($('#rname').value||'').trim(), t=Math.floor(Math.random()*n), a=Math.PI*2/n;
  const start=rangle; let end=-(t*a+a/2)+(Math.random()-.5)*a*.6; while(end<start+5*Math.PI*2)end+=Math.PI*2;
  const dur=matchMedia('(prefers-reduced-motion: reduce)').matches?500:4500, t0=performance.now();
  (function fr(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,4);rangle=start+(end-start)*e;drawWheel();
    if(k<1)requestAnimationFrame(fr);else{rangle%=Math.PI*2;rspin=false;const key=p[t];rdraw.push({k:key,w:who});store.set('hhm-ruleta16',rdraw);rwin(key,who)}})(t0);
}
function rwin(k,who){
  const o=$('#overlay'); o.hidden=false; o.dataset.k='';
  o.innerHTML=`<div class="win" role="dialog" aria-modal="true" aria-label="${C[k].n}"><div>${who?who+', tu país es…':'El país es…'}</div>${flag(k)}<h2>${C[k].n}</h2><p>Capital: <b>${C[k].cap}</b> · ${C[k].reg}</p>
   <div class="row" style="justify-content:center"><button class="btn" data-country="${k}">Ver su ficha</button><button class="btn ghost" id="rnext" style="color:#1b1712;border-color:#1b1712">Siguiente</button></div></div>`;
}
document.addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='rspin'){rgo();return}
  if(id==='rundo'){rdraw.pop();store.set('hhm-ruleta16',rdraw);render();return}
  if(id==='rreset'){rconfirm=true;render();return}
  if(id==='rno'){rconfirm=false;render();return}
  if(id==='ryes'){rdraw=[];rconfirm=false;store.set('hhm-ruleta16',rdraw);render();return}
  if(id==='rnext'){closeCountry();render();const i=$('#rname');if(i)i.focus();return}
});
document.addEventListener('keydown',e=>{if(e.target.id==='rname'&&e.key==='Enter'){e.preventDefault();rgo()}});

function vPaises(){
  const regs=['Todos','Norteamérica','Centroamérica','el Caribe','Sudamérica','Europa','África'];
  const list=ORDER.filter(k=>(filter==='Todos'||C[k].reg===filter)&&C[k].n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q));
  return `<section class="view"><div><div class="eyebrow">21 países</div><h2>Explorador de países</h2></div>
  <p class="lead">Toca un país para ver su ficha, sus historias en Cuentópolis y dónde leer más.</p>
  <div class="tools"><label class="note" for="search" style="flex:none">Buscar</label><input id="search" type="search" placeholder="Escribe un país…" value="${q}" autocomplete="off"></div>
  <div class="filters" role="group" aria-label="Región">${regs.map(r=>`<button data-f="${r}" aria-pressed="${r===filter}">${r==='el Caribe'?'Caribe':r}</button>`).join('')}</div>
  <div class="tiles" id="tiles">${list.map(k=>`<button class="tile" data-country="${k}">${flag(k)}<b>${C[k].n}</b><span>${C[k].reg}</span></button>`).join('')||'<p class="none">No hay países con ese nombre.</p>'}</div></section>`;
}
const QS=['¿Cuál es la capital?','¿Qué idioma o idiomas se hablan?','¿Cuál es una comida típica?','¿Qué animal es especial en este país?','¿Qué música, baile o tradición tiene?','Un dato curioso que me sorprendió'];
function openCountry(k){
  const c=C[k],reads=READS[k]||[],done=store.get('hhm-est-check',{})[k]||[];
  const o=$('#overlay'); o.hidden=false;
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="${c.n}">
   <div class="chead">${flag(k)}<div><div class="eyebrow">${c.reg}</div><h2>${c.n}</h2></div><button class="close" id="close">Cerrar ✕</button></div>
   <div class="facts"><div class="fact"><small>Capital</small>${c.cap}</div><div class="fact"><small>Idioma</small>${c.idi}</div><div class="fact"><small>Región</small>${c.reg}</div></div>
   <div class="sect"><h3>Ficha rápida</h3><div class="ficha">${c.ficha.map(f=>`<p>${f}</p>`).join('')}</div></div>
   <div class="sect"><h3>Lee en Cuentópolis</h3>${reads.length?`<div class="links">${reads.map(r=>`<a class="link" href="${r.u}"><div><b>${r.t}</b><span>${r.b}</span></div><span class="arrow">Abrir →</span></a>`).join('')}</div>`:'<p class="none">Todavía no hay una historia de este país en Cuentópolis.</p>'}</div>
   <div class="sect"><h3>Lee más</h3><div class="links"><a class="link" href="${VIKI+c.vk}" target="_blank" rel="noopener"><div><b>${c.n} en Vikidia</b><span>Enciclopedia en español para jóvenes de 8 a 13 años</span></div><span class="arrow">Abrir →</span></a></div></div>
   <div class="sect"><h3>Mi Pasaporte del País</h3><p class="note">Marca cada pregunta cuando encuentres la respuesta y escríbela en tu pasaporte.</p>
    <div class="check">${QS.map((qq,i)=>`<label><input type="checkbox" id="q-${k}-${i}" data-q="${i}" ${done.includes(i)?'checked':''}>${qq}</label>`).join('')}</div></div>
  </div>`;
  o.dataset.k=k; $('#close').focus();
}
function closeCountry(){$('#overlay').hidden=true;$('#overlay').innerHTML=''}

function render(){
  renderBands(); renderTabs();
  const B=BANDS[band];
  $('#main').innerHTML=tab==='ruta'?vRuta(B):tab==='misiones'?vMisiones(B):tab==='ruleta'?vRuleta():vPaises();
  if(tab==='ruleta')drawWheel();
}
$('#bands').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(!b)return;band=b.dataset.b;store.set('hhm-est-band',band);tab='ruta';render()});
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(!t)return;tab=t.dataset.t;render()});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]'); if(a&&a.href.startsWith(BASE)){ss.set('hhm-est-state',{band,tab,filter,country:$('#overlay').hidden?null:$('#overlay').dataset.k,y:window.scrollY})}
  const g=e.target.closest('[data-go]'); if(g){tab=g.dataset.go;render();window.scrollTo(0,0);return}
  const c=e.target.closest('[data-country]'); if(c){openCountry(c.dataset.country);return}
  const f=e.target.closest('[data-f]'); if(f){filter=f.dataset.f;render();return}
  if(e.target.id==='close'||e.target.id==='overlay'){closeCountry()}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const pos=e.target.selectionStart;render();const s=$('#search');s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const i=e.target.dataset.q;if(i==null)return;const k=$('#overlay').dataset.k;const all=store.get('hhm-est-check',{});const set=new Set(all[k]||[]);e.target.checked?set.add(+i):set.delete(+i);all[k]=[...set];store.set('hhm-est-check',all)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeCountry()});
render();
if(reopen&&C[reopen])openCountry(reopen);
if(back&&back.y&&!reopen)window.scrollTo(0,back.y);
</script>
