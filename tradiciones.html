<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprendiendo sobre las tradiciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one centered phone-first card on a warm autumn night; falling leaves behind; progress = a row of leaves that bloom into marigolds. Single committed look (night), both host themes. */
:root{
  --night:#22142E; --night2:#2F1D3F; --card:#FFF7EC; --ink:#2A1A33; --muted:#6E5A72;
  --marigold:#F7931E; --marigold-deep:#D9600B; --leaf:#B5652A; --rose:#E0457B; --teal:#1F9E9A; --ok:#2F8F4E; --no:#B23A48;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--card);font-family:var(--body);font-size:17px;line-height:1.45;margin:0;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.picado{display:flex;gap:6px;justify-content:center;margin-bottom:14px;width:100%;max-width:520px}
.picado span{flex:1;height:34px;clip-path:polygon(0 0,100% 0,100% 100%,83% 82%,66% 100%,50% 82%,33% 100%,17% 82%,0 100%)}
.picado span:nth-child(5n+1){background:var(--rose)}.picado span:nth-child(5n+2){background:var(--marigold)}.picado span:nth-child(5n+3){background:var(--teal)}.picado span:nth-child(5n+4){background:#8E5BD6}.picado span:nth-child(5n+5){background:#E8C43A}
.card{width:100%;max-width:520px;background:var(--card);color:var(--ink);border-radius:22px;padding:24px 20px 22px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.02;margin:0;color:var(--marigold-deep);text-wrap:balance}
.es{font-style:italic;color:var(--muted)}
.sub{margin:6px 0 0;font-size:19px;text-wrap:balance}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.intro{margin:16px 0 20px;display:grid;gap:6px}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--marigold);color:#2A1A33;width:100%;transition:transform .12s ease,background .12s ease}
.btn:hover{background:#FFA638}.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.progress{display:flex;gap:6px;justify-content:center;margin:0 0 16px}
.progress svg{width:30px;height:30px}
.q{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,27px);line-height:1.15;margin:0;text-wrap:balance}
.qen{margin:4px 0 16px;font-size:17px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;border:2px solid #E7D7C2;background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--marigold)}
.opt b{font-size:18px}.opt span{font-size:15px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:#E8F5EC}.opt.wrong{border-color:var(--no);background:#FBEAEC}
.opt:disabled{cursor:default}
.fact{margin:16px 0 0;padding:14px;border-radius:14px;background:#FCEBD3;display:grid;gap:6px}
.fact .verdict{font-family:var(--display);font-size:22px}
.fact .verdict.ok{color:var(--ok)}.fact .verdict.no{color:var(--no)}
.fact p{margin:0}
.next{margin-top:14px}
.end-bloom{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.end-bloom svg{width:40px;height:40px}
.score{font-family:var(--display);font-size:44px;color:var(--marigold-deep);margin:4px 0 0;text-align:center}
.foot{margin-top:16px;font-size:13px;color:#D9C8E0;text-align:center;max-width:520px}
@media (prefers-reduced-motion:reduce){.btn,.opt{transition:none}}
</style>
</head>
<body>


<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="picado" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main class="card" id="app" aria-live="polite"></main>
  <p class="foot">Spanish Department · Fall Festival · Departamento de Español · Feria de Otoño</p>
</div>

<script>
const Q = [
  { es:'¿Qué es una ofrenda?', en:'What is an ofrenda?',
    o:[['Una fiesta de cumpleaños','A birthday party'],['Un altar para recordar a las personas que queremos','An altar to remember the people we love'],['Una tienda de flores','A flower shop']], a:1,
    f:['Las familias la preparan para el 1 y 2 de noviembre, con fotos, flores, comida y velas.','Families set it up for November 1 and 2, with photos, flowers, food and candles.'] },
  { es:'¿Por qué hay tantas flores de cempasúchil?', en:'Why are there so many marigolds?',
    o:[['Su color y su olor guían el camino a casa','Their color and smell guide the way home'],['Son las flores más baratas','They are the cheapest flowers'],['Son para regalar en una boda','They are wedding gifts']], a:0,
    f:['Por eso muchas familias hacen un camino de pétalos hasta el altar.','That is why many families make a path of petals to the altar.'] },
  { es:'¿Para qué son las velas?', en:'What are the candles for?',
    o:[['Para cantar "Feliz cumpleaños"','To sing "Happy Birthday"'],['Para cocinar','For cooking'],['Para dar luz e iluminar el camino','To give light and light up the way']], a:2,
    f:['Hoy, nuestras velas son LED: ¡luz sin fuego!','Today our candles are LED: light without fire!'] },
  { es:'¿Por qué se pone un vaso de agua?', en:'Why is there a glass of water?',
    o:[['Para regar las flores','To water the flowers'],['Para calmar la sed después de un largo viaje','To quench thirst after a long journey'],['Para lavar las fotos','To clean the photos']], a:1,
    f:['Cada cosa del altar tiene un significado.','Every item on the altar has a meaning.'] },
  { es:'¿Qué pan se pone en la ofrenda?', en:'Which bread goes on the ofrenda?',
    o:[['El pan de muerto','Pan de muerto'],['El pan de ajo','Garlic bread'],['El pan de hamburguesa','A burger bun']], a:0,
    f:['Es un pan dulce con formas de huesitos y azúcar encima. ¡Nuestros estudiantes lo probaron esta semana!','A sweet bread with little bone shapes and sugar on top. Our students tasted it this week!'] },
  { es:'Frida Kahlo fue…', en:'Frida Kahlo was…',
    o:[['Una cantante cubana','A Cuban singer'],['Una pintora mexicana','A Mexican painter'],['Una chef española','A Spanish chef']], a:1,
    f:['Pintó muchos autorretratos con colores fuertes y flores en el pelo. ¡Y tenía monos y perros en su casa!','She painted many self-portraits with bold colors and flowers in her hair. She also kept monkeys and dogs at home!'] },
  { es:'Diego Rivera fue…', en:'Diego Rivera was…',
    o:[['Un pintor mexicano de murales enormes','A Mexican painter of huge murals'],['Un futbolista','A soccer player'],['Un escritor de cómics','A comic book writer']], a:0,
    f:['Pintó la historia de México en las paredes. Estaba casado con Frida Kahlo.','He painted the history of Mexico on walls. He was married to Frida Kahlo.'] },
  { es:'Selena Quintanilla fue…', en:'Selena Quintanilla was…',
    o:[['Una pintora','A painter'],['Una maestra','A teacher'],['Una cantante, "la Reina de la Música Tejana"','A singer, "the Queen of Tejano Music"']], a:2,
    f:['Cantaba cumbia y música tejana. Su canción "Bidi Bidi Bom Bom" todavía se baila hoy.','She sang cumbia and Tejano music. People still dance to "Bidi Bidi Bom Bom" today.'] },
  { es:'Eric Carle escribió y dibujó…', en:'Eric Carle wrote and illustrated…',
    o:[['"La oruga muy hambrienta"','"The Very Hungry Caterpillar"'],['"Spider-Man"','"Spider-Man"'],['"Cien años de soledad"','"One Hundred Years of Solitude"']], a:0,
    f:['Hacía sus dibujos con papel pintado y recortado, como un collage.','He made his pictures from painted, cut paper, like a collage.'] },
  { es:'Stan Lee ayudó a crear a…', en:'Stan Lee helped create…',
    o:[['Mickey Mouse','Mickey Mouse'],['Spider-Man','Spider-Man'],['Goku','Goku']], a:1,
    f:['También a Hulk, Iron Man y los X-Men. ¡Salía en las películas de Marvel como sorpresa!','Also Hulk, Iron Man and the X-Men. He made surprise cameos in Marvel movies!'] },
];

const leafSVG = (c='#B5652A') => `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 L23 13 L31 10 L28 18 L36 20 L28 24 L31 31 L23 28 L20 36 L17 28 L9 31 L12 24 L4 20 L12 18 L9 10 L17 13 Z" fill="${c}"/><path d="M20 12 V38" stroke="#6b3a17" stroke-width="2"/></svg>`;
const bloomSVG = () => { let p=''; for(let i=0;i<10;i++){const a=i*Math.PI/5; p+=`<circle cx="${20+8*Math.cos(a)}" cy="${20+8*Math.sin(a)}" r="7" fill="${i%2?'#F7931E':'#FFB347'}"/>`;} return `<svg viewBox="0 0 40 40" aria-hidden="true">${p}<circle cx="20" cy="20" r="6" fill="#D9600B"/></svg>`; };

const app = document.getElementById('app');
let i = 0, score = 0, results = [];

function progress(){
  return `<div class="progress" aria-label="Pregunta ${i+1} de ${Q.length}">${Q.map((_,k)=> results[k]===true ? bloomSVG() : leafSVG(k===i ? '#E0A040' : (results[k]===false ? '#8a6a4a' : '#B5652A'))).join('')}</div>`;
}
function start(){
  i=0; score=0; results=[];
  app.innerHTML = `<p class="kicker">Nuestra ofrenda · Fall Festival</p>
    <h1>Aprendiendo sobre las tradiciones</h1>
    <p class="sub es">Fall Traditions in Mexico</p>
    <div class="intro"><p style="margin:0">${Q.length} preguntas sobre nuestra ofrenda. Cada respuesta correcta convierte una hoja en una flor de cempasúchil.</p>
    <p class="es" style="margin:0">${Q.length} questions about our ofrenda. Every right answer turns a leaf into a marigold.</p></div>
    <div class="progress">${Q.map(()=>leafSVG()).join('')}</div>
    <button class="btn" id="go">¡Empezar! · Start</button>`;
  document.getElementById('go').onclick = show;
}
function show(){
  const q = Q[i];
  app.innerHTML = `${progress()}<p class="kicker">Pregunta ${i+1} de ${Q.length} · Question ${i+1} of ${Q.length}</p>
    <h2 class="q">${q.es}</h2><p class="qen es">${q.en}</p>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${k}"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>
    <div id="fb"></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  app.querySelector('.opt').focus({preventScroll:true});
}
function answer(k){
  const q = Q[i], ok = k === q.a;
  results[i] = ok; if (ok) score++;
  app.querySelectorAll('.opt').forEach(b => { b.disabled = true; const n=+b.dataset.k; if(n===q.a) b.classList.add('right'); else if(n===k) b.classList.add('wrong'); });
  app.querySelector('.progress').outerHTML = progress();
  const last = i === Q.length-1;
  document.getElementById('fb').innerHTML = `<div class="fact"><div class="verdict ${ok?'ok':'no'}">${ok?'¡Muy bien! · Well done!':'¡Casi! · Almost!'}</div>
    <p>${q.f[0]}</p><p class="es">${q.f[1]}</p></div>
    <button class="btn next" id="next">${last?'Ver mis flores · See my flowers':'Siguiente · Next'}</button>`;
  const nx = document.getElementById('next'); nx.onclick = () => { if(last) end(); else { i++; show(); } }; nx.focus({preventScroll:true});
}
function end(){
  const msg = score >= 8 ? ['¡Eres experto en Día de Muertos!','You are a Día de Muertos expert!'] : score >= 5 ? ['¡Tus tradiciones florecen!','Your traditions are blooming!'] : ['¡Cada hoja es una nueva flor por aprender!','Every leaf is a new flower to learn!'];
  app.innerHTML = `<p class="kicker">¡Felicidades! · Congratulations!</p>
    <h1>${msg[0]}</h1><p class="sub es">${msg[1]}</p>
    <div class="end-bloom">${results.map(r=> r? bloomSVG(): leafSVG()).join('')}</div>
    <p class="score">${score} / ${Q.length}</p>
    <p style="text-align:center;margin:0 0 18px">flores de cempasúchil · marigolds bloomed</p>
    <button class="btn" id="again">Jugar otra vez · Play again</button>`;
  document.getElementById('again').onclick = start;
}
start();

// falling leaves → petals
(function(){
  const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,items=[];
  const cols=['#B5652A','#D98A2B','#8C4A1F','#F7931E','#FFB347'];
  function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
  size(); addEventListener('resize',size);
  for(let k=0;k<26;k++) items.push({x:Math.random(),y:Math.random(),s:.6+Math.random()*.9,v:.0006+Math.random()*.0012,r:Math.random()*6,c:cols[k%cols.length],w:Math.random()*6});
  function leaf(p){
    const x=p.x*W, y=p.y*H, s=10*p.s*devicePixelRatio;
    ctx.save(); ctx.translate(x,y); ctx.rotate(p.r); ctx.globalAlpha=.55; ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.ellipse(0,0,s,s*.55,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  function frame(t){
    ctx.clearRect(0,0,W,H);
    items.forEach(p=>{ if(!reduce){ p.y+=p.v; p.x+=Math.sin(t/1600+p.w)*.0004; p.r+=.01; if(p.y>1.05){p.y=-.05;p.x=Math.random();} } leaf(p); });
    if(!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
